# Builds SpaceRazer for Windows, Linux and macOS and publishes the packages
# to a GitHub Release.
#
# Trigger: push a tag matching the workspace version, e.g.
#   git tag v0.1.0 && git push origin v0.1.0
# or run it by hand from the Actions tab with an existing tag.
#
# macOS signing and notarization are optional. Without the APPLE_* secrets
# the app is ad-hoc signed; users open it the first time with right-click →
# Open. To notarize, add these repository secrets:
#   APPLE_CERTIFICATE           base64 of a "Developer ID Application" .p12
#   APPLE_CERTIFICATE_PASSWORD  password of that .p12
#   APPLE_SIGNING_IDENTITY      e.g. "Developer ID Application: Name (TEAMID)"
#   APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD  (app-specific password)

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and publish, e.g. v0.1.0"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  version:
    name: Check version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - name: Tag must look like vMAJOR.MINOR.PATCH
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::'$TAG' is not a version tag like v0.1.0"
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - id: v
        name: Tag must match the workspace version
        run: |
          version="${TAG#v}"
          cargo_version=$(sed -n '/^\[workspace.package\]/,/^\[/ s/^version *= *"\(.*\)"/\1/p' Cargo.toml)
          if [ "$version" != "$cargo_version" ]; then
            echo "::error::Tag $TAG does not match workspace version $cargo_version in Cargo.toml"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  linux:
    name: Linux ${{ matrix.arch }}
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          # Arm runners are free for public repositories.
          - arch: aarch64
            os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: System libraries for the GUI
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libgl1-mesa-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} -p sr-gui -p sr-cli
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb
      - name: Package
        run: |
          name="spacerazer-$VERSION-linux-${{ matrix.arch }}"
          bin="target/${{ matrix.target }}/release"
          mkdir -p "dist/$name"
          cp "$bin/spacerazer" "$bin/spacerazer-cli" "dist/$name/"
          cp packaging/linux/spacerazer.desktop "dist/$name/"
          cp crates/sr-gui/assets/icon.png "dist/$name/spacerazer.png"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          rm -rf "dist/$name"
          cargo deb -p sr-gui --no-build --target ${{ matrix.target }} --deb-version "$VERSION" \
            --output "dist/spacerazer_${VERSION}_$(dpkg --print-architecture).deb"
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  windows:
    name: Windows x86_64
    needs: version
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --locked -p sr-gui -p sr-cli
      - name: Package
        shell: pwsh
        run: |
          $name = "spacerazer-$env:VERSION-windows-x86_64"
          New-Item -ItemType Directory -Force -Path "dist/$name" | Out-Null
          Copy-Item target/release/spacerazer.exe, target/release/spacerazer-cli.exe "dist/$name/"
          Compress-Archive -Path "dist/$name/*" -DestinationPath "dist/$name.zip"
          Remove-Item -Recurse "dist/$name"
          Get-ChildItem dist
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: dist/*
          if-no-files-found: error

  macos:
    name: macOS universal
    needs: version
    runs-on: macos-14
    env:
      VERSION: ${{ needs.version.outputs.version }}
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Build both architectures
        run: |
          cargo build --release --locked --target aarch64-apple-darwin -p sr-gui -p sr-cli
          cargo build --release --locked --target x86_64-apple-darwin -p sr-gui -p sr-cli
      - name: Universal binaries
        run: |
          mkdir -p build
          for b in spacerazer spacerazer-cli; do
            lipo -create -output "build/$b" \
              "target/aarch64-apple-darwin/release/$b" "target/x86_64-apple-darwin/release/$b"
          done
          lipo -info build/spacerazer
      - name: App bundle
        run: |
          app="build/SpaceRazer.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          cp build/spacerazer build/spacerazer-cli "$app/Contents/MacOS/"
          sed "s/__VERSION__/$VERSION/g" packaging/macos/Info.plist > "$app/Contents/Info.plist"
          # Icon: every size macOS asks for, from the 1024 px master.
          iconset=build/SpaceRazer.iconset
          mkdir -p "$iconset"
          for s in 16 32 128 256 512; do
            sips -z $s $s crates/sr-gui/assets/icon.png --out "$iconset/icon_${s}x${s}.png" >/dev/null
            d=$((s * 2))
            sips -z $d $d crates/sr-gui/assets/icon.png --out "$iconset/icon_${s}x${s}@2x.png" >/dev/null
          done
          iconutil -c icns "$iconset" -o "$app/Contents/Resources/SpaceRazer.icns"
      - name: Sign with Developer ID
        if: env.APPLE_CERTIFICATE != ''
        env:
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          keychain="$RUNNER_TEMP/build.keychain"
          password="$(openssl rand -hex 16)"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          app=build/SpaceRazer.app
          codesign --force --options runtime --timestamp -s "$APPLE_SIGNING_IDENTITY" "$app/Contents/MacOS/spacerazer-cli"
          codesign --force --options runtime --timestamp -s "$APPLE_SIGNING_IDENTITY" "$app"
          codesign --verify --strict --verbose=2 "$app"
      - name: Ad-hoc sign
        if: env.APPLE_CERTIFICATE == ''
        run: codesign --force --deep -s - build/SpaceRazer.app
      - name: Disk image
        run: |
          mkdir -p dist build/dmg
          cp -R build/SpaceRazer.app build/dmg/
          ln -s /Applications build/dmg/Applications
          hdiutil create -volname "SpaceRazer $VERSION" -srcfolder build/dmg -ov -format UDZO \
            "dist/SpaceRazer-$VERSION-macos-universal.dmg"
          # Command-line tool on its own, for scripts and servers.
          tar -C build -czf "dist/spacerazer-cli-$VERSION-macos-universal.tar.gz" spacerazer-cli
      - name: Notarize
        if: env.APPLE_CERTIFICATE != ''
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          dmg="dist/SpaceRazer-$VERSION-macos-universal.dmg"
          xcrun notarytool submit "$dmg" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple "$dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-universal
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [version, linux, windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: SpaceRazer ${{ needs.version.outputs.version }}
          generate_release_notes: true
          prerelease: ${{ contains(env.TAG, '-') }}
          files: dist/*
          fail_on_unmatched_files: true
