[package]
name = "sr-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true
description = "See what fills your disk and reclaim space safely"
homepage.workspace = true

[[bin]]
name = "spacerazer"
path = "src/main.rs"

[dependencies]
sr-core.workspace = true
sr-platform.workspace = true
sr-scan.workspace = true
sr-ops.workspace = true
sr-devsweep.workspace = true
sr-dedup.workspace = true
sr-cli.workspace = true
anyhow.workspace = true
crossbeam-channel.workspace = true
directories.workspace = true
eframe.workspace = true
egui.workspace = true
egui_extras.workspace = true
rfd.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
image.workspace = true

[package.metadata.deb]
name = "spacerazer"
maintainer = "Arjun Adhikari <33110520+theArjun@users.noreply.github.com>"
section = "utils"
priority = "optional"
depends = "$auto"
extended-description = "Interactive sunburst disk map, developer build-artifact cleaner and duplicate finder, with a reviewable Trash Drawer for safe deletion."
assets = [
    ["target/release/spacerazer", "usr/bin/", "755"],
    ["target/release/spacerazer-cli", "usr/bin/", "755"],
    ["../../packaging/linux/spacerazer.desktop", "usr/share/applications/", "644"],
    ["assets/icon.png", "usr/share/icons/hicolor/1024x1024/apps/spacerazer.png", "644"],
    ["assets/icon-256.png", "usr/share/icons/hicolor/256x256/apps/spacerazer.png", "644"],
]
